<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Plantas - AGROCAMPO</title>
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <style>
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--espacio-lg);
            margin-bottom: var(--espacio-xl);
        }

        .upload-zone {
            border: 2px dashed var(--borde);
            border-radius: var(--radio-md);
            padding: var(--espacio-xl);
            text-align: center;
            background-color: var(--fondo);
            transition: var(--transicion);
            cursor: pointer;
        }

        .upload-zone:hover {
            border-color: var(--verde-claro);
            background-color: var(--verde-suave);
        }

        .upload-icon, .camera-icon {
            font-size: 4rem;
            margin-bottom: var(--espacio-md);
        }

        .camera-preview {
            background-color: var(--fondo);
            border-radius: var(--radio-md);
            padding: var(--espacio-xl);
            text-align: center;
            margin-bottom: var(--espacio-lg);
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🌱</span>
                    <h2 class="logo-text">AGROCAMPO</h2>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="cultivos.html" class="nav-item">
                    <span class="nav-icon">🌾</span>
                    <span class="nav-text">Mis cultivos</span>
                </a>
                <a href="analisis.html" class="nav-item active">
                    <span class="nav-icon">🔍</span>
                    <span class="nav-text">Analizar planta</span>
                </a>
                <a href="biblioteca.html" class="nav-item">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">Biblioteca de enfermedades</span>
                </a>
                <a href="perfil.html" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">Perfil y configuración</span>
                </a>
            </nav>
        </aside>
        
        <div class="main-content">
            <header class="page-header">
                <h1>Análisis de Plantas</h1>
                <div class="header-actions">
                    <div class="search-box">
                        <input type="search" placeholder="Buscar..." />
                    </div>
                    <div class="user-avatar">👤</div>
                </div>
            </header>
            
            <div class="content-wrapper">
                <div class="analysis-grid">
                    <div class="card">
                        <h3>Subir fotografía</h3>
                        <div class="upload-zone">
                            <div class="upload-icon">☁️</div>
                            <p>Arrastra y suelta una imagen aquí o haz clic para subir</p>
                            <button class="btn btn-secondary">Seleccionar archivo</button>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>Tomar fotografía</h3>
                        <div class="camera-preview">
                            <div class="camera-icon">📷</div>
                        </div>
                        <button class="btn btn-primary btn-block">📸 Tomar foto</button>
                    </div>
                </div>
                
                <div class="card">
                    <h3>Opciones de análisis</h3>
                    <div class="form-group">
                        <label for="plantType">Tipo de planta:</label>
                        <select id="plantType">
                            <option value="">Seleccionar...</option>
                            <option value="tomate">Tomate</option>
                            <option value="lechuga">Lechuga</option>
                            <option value="pimiento">Pimiento</option>
                            <option value="maiz">Maíz</option>
                            <option value="patata">Patata</option>
                        </select>
                    </div>
                    <button class="btn btn-primary">🔍 Iniciar análisis</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
