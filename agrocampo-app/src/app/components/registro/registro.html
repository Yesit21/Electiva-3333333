<!-- Pantalla de Registro -->
<div class="auth-container">
  <div class="auth-layout">
    <!-- Columna izquierda: Formulario -->
    <div class="auth-form-section">
      <div class="auth-form-wrapper">
        <div class="logo-small">
          <span class="logo-icon">🌱</span>
        </div>
        
        <h1>Crear Cuenta</h1>
        
        <form class="auth-form">
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input 
              type="text" 
              id="nombre" 
              name="nombre" 
              placeholder="Ingresa tu nombre completo"
              required
            />
          </div>
          
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="correo@ejemplo.com"
              required
            />
          </div>
          
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Crea una contraseña segura"
              required
            />
          </div>
          
          <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword" 
              placeholder="Confirma tu contraseña"
              required
            />
          </div>
          
          <button type="submit" class="btn btn-primary btn-block">
            Registrarse
          </button>
        </form>
        
        <p class="auth-link">
          ¿Ya tienes una cuenta? 
          <a routerLink="/login">Inicia sesión</a>
        </p>
      </div>
    </div>
    
    <!-- Columna derecha: Imagen ilustrativa -->
    <div class="auth-image-section">
      <div class="image-placeholder">
        <svg viewBox="0 0 400 300" class="illustration">
          <rect width="400" height="300" fill="var(--verde-suave)" rx="12"/>
          <circle cx="200" cy="150" r="60" fill="var(--verde-claro)" opacity="0.3"/>
          <circle cx="200" cy="150" r="40" fill="var(--verde-primario)" opacity="0.5"/>
          <text x="200" y="160" text-anchor="middle" font-size="48" fill="var(--verde-oscuro)">🌱</text>
        </svg>
      </div>
    </div>
  </div>
</div>
